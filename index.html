<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary SEO -->
    <title>
      Autoviax.net_Dashboard | Autonomous Mobility Intelligence for Automotive & Logistics
    </title>

    <meta
      name="description"
      content="AutoViaX is an autonomous mobility intelligence platform for automotive and logistics businesses, delivering fleet optimisation, route intelligence, mobility analytics and safety assurance."
    />

    <meta
      name="keywords"
      content="AutoViaX, autonomous mobility intelligence, automotive technology, logistics technology, fleet optimisation, route intelligence, mobility intelligence, fleet analytics, autonomous mobility, vehicle intelligence, logistics optimisation, automotive AI"
    />

    <meta name="author" content="AutoViaX" />
    <meta name="publisher" content="AutoViaX" />

    <meta name="application-name" content="AutoViaX" />

    <!-- Business Information -->
    <meta name="business-name" content="AutoViaX" />
    <meta name="business-industry" content="Automotive / Logistics" />
    <meta name="business-niche" content="Autonomous Mobility Intelligence" />
    <meta name="domain" content="AutoViaX.net" />

    <!-- Robots -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://autoviax.net/" />

    <!-- Theme -->
    <meta name="theme-color" content="#010206" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="AutoViaX | Autonomous Mobility Intelligence" />

    <meta
      property="og:description"
      content="AutoViaX delivers autonomous mobility intelligence for automotive and logistics, enabling smarter fleet optimisation, route intelligence and safety assurance."
    />

    <meta property="og:url" content="https://autoviax.net/" />

    <meta property="og:site_name" content="AutoViaX" />

    <meta property="og:locale" content="en_US" />

    <!--
      Add your social sharing image here if available.
      Recommended size: 1200 × 630px
    -->
    <meta property="og:image" content="https://autoviax.net/og-image.jpg" />
    <meta property="og:image:alt" content="AutoViaX - Autonomous Mobility Intelligence" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="AutoViaX | Autonomous Mobility Intelligence" />

    <meta
      name="twitter:description"
      content="Autonomous mobility intelligence for automotive and logistics. Optimise fleets, understand routes and improve mobility safety with AutoViaX."
    />

    <meta name="twitter:image" content="https://autoviax.net/og-image.jpg" />

    <meta name="twitter:image:alt" content="AutoViaX - Autonomous Mobility Intelligence" />

    <!-- Mobile / Browser -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://api.fontshare.com" />

    <!-- Fonts -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap"
    />

    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap"
    />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "AutoViaX",
        "url": "https://autoviax.net/",
        "logo": "https://autoviax.net/logo.svg",
        "description": "AutoViaX is an autonomous mobility intelligence platform for automotive and logistics businesses.",
        "industry": "Automotive / Logistics",
        "knowsAbout": [
          "Autonomous Mobility Intelligence",
          "Fleet Optimisation",
          "Route Intelligence",
          "Mobility Analytics",
          "Automotive Technology",
          "Logistics Technology",
          "Safety Assurance"
        ]
      }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AutoViaX",
        "url": "https://autoviax.net/",
        "description": "Autonomous Mobility Intelligence for Automotive and Logistics"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
